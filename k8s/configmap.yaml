apiVersion: v1
kind: ConfigMap
metadata:
  name: planning-poker
  namespace: planning-poker
  labels:
    app.kubernetes.io/name: planning-poker
    app.kubernetes.io/part-of: planning-poker
data:
  PORT: "8080"
  DEFAULT_RATE: "4"
  # Hours are rounded UP to the next multiple of this (0.5 = half hours, 1 = whole hours)
  HOURS_ROUNDING_STEP: "0.5"
  # Default session name on the start form (also used when left blank)
  DEFAULT_SESSION_NAME: "Estimation session"
  SESSION_TTL_HOURS: "24"
  OFFLINE_GRACE_SECONDS: "20"
  DATA_FILE: /data/sessions.json
  # Replace with your Jira Cloud site, e.g. https://url1
  JIRA_BASE_URL: "https://url1"
  # Leave empty to auto-discover "Story Points" / "Story point estimate"
  JIRA_STORY_POINTS_FIELD: ""
  # "true" shows per-ticket "Save to Jira" buttons (UPDATE Jiras does not need it)
  JIRA_WRITE_BACK: "false"
  # e.g. "project = PROJ AND sprint in openSprints() ORDER BY rank"
  JIRA_DEFAULT_JQL: "sprint in openSprints() ORDER BY rank"
  # Default board for "Load from Jira", by name (or a numeric id); JIRA_DEFAULT_BOARD_ID is an older alias
  JIRA_DEFAULT_BOARD: ""
  # Optional project key preselected in the Project dropdown (limits the board picker), e.g. "PROJ"
  JIRA_DEFAULT_BOARD_PROJECT: ""
  # Also set Remaining estimate = max(0, new Original estimate - time logged) when time is written; "false" = Original only
  JIRA_RECALC_REMAINING: "true"
  # Default selection of "Update in Jira" (UPDATE Jiras): sp | time | both
  JIRA_UPDATE_DEFAULT_MODE: "both"
