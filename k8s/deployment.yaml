apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning-poker
  namespace: planning-poker
  labels:
    app.kubernetes.io/name: planning-poker
    app.kubernetes.io/part-of: planning-poker
spec:
  replicas: 1
  # Single instance only: WebSocket session state is in-process and the
  # JSON store is a local file. Rolling updates would drop connections
  # and could race on the data file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: planning-poker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planning-poker
        app.kubernetes.io/part-of: planning-poker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planning-poker
          # Replace REGISTRY with your registry (see README).
          image: REGISTRY/planning-poker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: planning-poker
            - secretRef:
                name: planning-poker
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planning-poker-data
